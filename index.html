<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangoBoost HRMS</title>
<link rel="icon" type="image/png" href="./favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --mg:#F5A623;--mg-d:#D4891A;--mg-l:#FEF3E2;--mg-m:#FDDDA0;
  --g50:#FAFAFA;--g100:#F5F5F5;--g200:#E8E8E8;--g300:#D1D1D1;
  --g400:#A8A8A8;--g500:#717171;--g600:#525252;--g700:#3D3D3D;--g800:#262626;--g900:#141414;
  --red:#EF4444;--red-l:#FEE2E2;--green:#16A34A;--green-l:#DCFCE7;
  --blue:#2563EB;--blue-l:#DBEAFE;--purple-l:#EDE9FE;--purple:#7C3AED;
  --sw:220px;--r:8px;--r-lg:12px;--sh:0 1px 3px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--g100);color:var(--g800);font-size:13px;line-height:1.5}

/* AUTH */
#auth{display:none;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(150deg,#FFF8ED,#FEF0D0,#FDDDA0)}
.ac{background:#fff;border-radius:20px;padding:44px 40px;width:380px;box-shadow:0 20px 60px rgba(245,166,35,.18);text-align:center}
.albl{font-size:11px;font-weight:700;color:var(--g600);text-align:left;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
.ainp{width:100%;padding:10px 13px;border:1.5px solid var(--g200);border-radius:var(--r);font-size:13px;outline:none;margin-bottom:12px}
.ainp:focus{border-color:var(--mg)}
.abtn{width:100%;padding:11px;background:var(--mg);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer}
.abtn:hover{background:var(--mg-d)}
.adiv{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--g400);font-size:11px}
.adiv::before,.adiv::after{content:'';flex:1;height:1px;background:var(--g200)}
.gbtn{width:100%;padding:10px;background:#fff;border:1.5px solid var(--g200);border-radius:var(--r);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--g700)}
.gbtn:hover{background:var(--g50)}
.aerr{color:var(--red);font-size:12px;margin:-4px 0 8px;text-align:left;display:none}

/* APP */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sb{width:var(--sw);background:var(--g900);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;overflow-y:auto}
.sb-logo{padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-logo-sub{font-size:10px;color:rgba(255,255,255,.3);margin-top:3px}
.sb-nav{flex:1;padding:8px 0}
.ni{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;transition:all .15s;border-left:2px solid transparent}
.ni:hover{color:#fff;background:rgba(255,255,255,.05)}
.ni.active{color:#fff;background:rgba(245,166,35,.14);border-left-color:var(--mg)}
.ni.locked{opacity:.4;cursor:not-allowed;pointer-events:none}
.ni svg{width:14px;height:14px;flex-shrink:0}
.ni .lock{font-size:9px;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px;margin-left:auto;color:rgba(255,255,255,.3)}
.sb-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07)}
.sb-av{width:28px;height:28px;border-radius:50%;background:var(--mg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.sb-un{font-size:12px;font-weight:600;color:#fff}
.sb-ue{font-size:10px;color:rgba(255,255,255,.4)}
.badge-master{font-size:9px;background:var(--mg);color:#fff;padding:1px 6px;border-radius:10px;font-weight:700}
.badge-admin{font-size:9px;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);padding:1px 6px;border-radius:10px}
.badge-viewer{font-size:9px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);padding:1px 6px;border-radius:10px}
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--g200);padding:0 22px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.pg-title{font-size:14px;font-weight:700}
.cnt{padding:20px 22px;flex:1}
.btn{padding:6px 12px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:5px;line-height:1}
.btn-p{background:var(--mg);color:#fff}.btn-p:hover{background:var(--mg-d)}
.btn-s{background:#fff;color:var(--g700);border:1px solid var(--g200)}.btn-s:hover{background:var(--g50)}
.btn-d{background:var(--red-l);color:var(--red)}.btn-d:hover{background:#FECACA}
.btn-g{background:var(--green-l);color:var(--green)}
.btn-sm{padding:5px 10px;font-size:11px}.btn-xs{padding:3px 7px;font-size:10px}
.card{background:#fff;border-radius:var(--r-lg);border:1px solid var(--g200);box-shadow:var(--sh)}
.card-h{padding:12px 16px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between}
.card-t{font-size:13px;font-weight:700}
.card-b{padding:16px}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.sc{background:#fff;border-radius:var(--r-lg);padding:16px;border:1px solid var(--g200)}
.sc-lbl{font-size:11px;color:var(--g500);font-weight:600;margin-bottom:4px}
.sc-val{font-size:24px;font-weight:800;color:var(--g800);line-height:1}
.sc-sub{font-size:10px;color:var(--g400);margin-top:4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--g500);background:var(--g50);border-bottom:1px solid var(--g200);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
tbody td{padding:9px 10px;border-bottom:1px solid var(--g100);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.td-nm{display:flex;align-items:center;gap:8px}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.nm{font-weight:600;font-size:12px}.nm-en{font-size:10px;color:var(--g400)}
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.bdg-r{background:var(--green-l);color:#166534}.bdg-c{background:#FEF9C3;color:#854D0E}
.bdg-i{background:var(--purple-l);color:var(--purple)}.bdg-t{background:var(--red-l);color:#991B1B}
.bdg-e{background:var(--green-l);color:#166534}.bdg-wr{background:#FEF9C3;color:#92400E}
.bdg-rs{background:var(--g100);color:var(--g500)}.bdg-lv{background:#FEE2E2;color:#9F1239}
.bdg-tech{background:var(--blue-l);color:var(--blue)}.bdg-nt{background:var(--purple-l);color:var(--purple)}
.bdg-mg{background:var(--mg-l);color:var(--mg-d)}.bdg-disc{background:#FFF1F2;color:#9F1239}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sw-wrap{position:relative;flex:1;min-width:160px;max-width:280px}
.sw-icon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--g400);width:12px;height:12px}
.sinp{width:100%;padding:6px 10px 6px 26px;border:1px solid var(--g200);border-radius:var(--r);font-size:12px;outline:none;background:#fff}
.sinp:focus{border-color:var(--mg)}
.fsel{padding:6px 10px;border:1px solid var(--g200);border-radius:var(--r);font-size:12px;background:#fff;outline:none;cursor:pointer;color:var(--g700)}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center}
.mb.open{display:flex}
.md{background:#fff;border-radius:var(--r-lg);width:680px;max-width:96vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.md-lg{width:860px}.md-xl{width:1020px}.md-sm{width:440px}
.md-h{padding:16px 20px 12px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.md-t{font-size:14px;font-weight:700}
.md-x{width:24px;height:24px;border-radius:6px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g400);font-size:16px}
.md-x:hover{background:var(--g100)}
.md-b{padding:20px;overflow-y:auto;flex:1}
.md-f{padding:12px 20px;border-top:1px solid var(--g100);display:flex;justify-content:flex-end;gap:6px;flex-shrink:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ff{grid-column:1/-1}
.fgrp{display:flex;flex-direction:column;gap:4px}
.flbl{font-size:11px;font-weight:700;color:var(--g600)}
.req{color:var(--red);margin-left:2px}
.finp,.fsel2,.ftxt{padding:7px 10px;border:1px solid var(--g200);border-radius:var(--r);font-size:12px;outline:none;background:#fff;color:var(--g800);font-family:inherit;transition:border-color .15s;width:100%}
.finp:focus,.fsel2:focus,.ftxt:focus{border-color:var(--mg)}
.ftxt{resize:vertical;min-height:60px}
.fsec{font-size:10px;font-weight:800;color:var(--mg-d);text-transform:uppercase;letter-spacing:.07em;grid-column:1/-1;padding:5px 0 3px;border-bottom:2px solid var(--mg-l);margin-top:4px}
.dp-wrap{position:relative}
.dp-cal{position:absolute;top:calc(100% + 4px);left:0;z-index:600;background:#fff;border:1px solid var(--g200);border-radius:var(--r-lg);box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px;width:260px;display:none}
.dp-cal.open{display:block}
.dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.dp-nb{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;font-size:13px;color:var(--g700)}
.dp-nb:hover{background:var(--g100)}
.dp-hd{font-size:13px;font-weight:700;color:var(--g800);cursor:pointer;padding:2px 6px;border-radius:4px}
.dp-hd:hover{background:var(--mg-l);color:var(--mg-d)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.dp-dow{text-align:center;font-size:10px;font-weight:700;color:var(--g400);padding:3px 0}
.dp-day{text-align:center;font-size:11px;padding:5px 2px;border-radius:5px;cursor:pointer;color:var(--g700);line-height:1.4}
.dp-day:hover{background:var(--mg-l);color:var(--mg-d)}
.dp-day.dp-today{font-weight:800;color:var(--mg)}
.dp-day.dp-sel{background:var(--mg);color:#fff;font-weight:700}
.dp-day.dp-empty{cursor:default;pointer-events:none}
.dp-sg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.dp-sb{padding:6px 4px;font-size:12px;border:1px solid var(--g200);border-radius:6px;background:#fff;cursor:pointer;color:var(--g700);text-align:center}
.dp-sb:hover,.dp-sb.dp-on{background:var(--mg);color:#fff;border-color:var(--mg)}
.ed-wrap{display:flex;flex-direction:column;gap:14px}
.ed-top{display:grid;grid-template-columns:90px 1fr 1fr;gap:14px;background:linear-gradient(135deg,var(--mg-l),#fff);border-radius:var(--r-lg);border:1px solid var(--mg-m);padding:16px}
.ed-photo-def{width:90px;height:112px;border-radius:var(--r);background:linear-gradient(135deg,var(--g200),var(--g100));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--g300)}
.ed-photo-wrap{position:relative;display:inline-block}
.leave-flag{position:absolute;bottom:0;left:0;right:0;background:rgba(37,99,235,.85);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:2px 0;border-radius:0 0 var(--r) var(--r)}
.resign-flag{position:absolute;bottom:0;left:0;right:0;background:rgba(239,68,68,.85);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:2px 0;border-radius:0 0 var(--r) var(--r)}
.ed-name{font-size:18px;font-weight:800;margin-bottom:4px}
.ed-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.ed-kv{display:flex;gap:6px;font-size:12px;padding:2px 0}
.ed-k{color:var(--g500);min-width:80px;flex-shrink:0;font-size:11px}
.ed-v{color:var(--g800);font-weight:500}
.ed-mid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-table{width:100%;border-collapse:collapse;font-size:11px}
.ed-table th{background:var(--g50);padding:6px 10px;text-align:left;font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;border-bottom:1px solid var(--g200)}
.ed-table td{padding:6px 10px;border-bottom:1px solid var(--g100)}
.ed-table tr:last-child td{border-bottom:none}
.warn-box{background:#FFF7ED;border:1.5px solid #FED7AA;border-radius:var(--r);padding:7px 11px;font-size:11px;color:#9A3412;font-weight:600}
.leave-info-box{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:var(--r);padding:6px 10px;font-size:11px;color:#1D4ED8;font-weight:600;margin-top:3px}
.resign-info-box{background:#FFF1F2;border:1px solid #FFE4E6;border-radius:var(--r);padding:6px 10px;font-size:11px;color:#9F1239;font-weight:600;margin-top:3px}
tr.row-resigned td{background:#fff5f5!important}
tr.row-leave td{background:#f0f7ff!important}
tr.row-resigned:hover td{background:#fee2e2!important}
tr.row-leave:hover td{background:#dbeafe!important}
.uz{border:2px dashed var(--g300);border-radius:var(--r-lg);padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:var(--g50)}
.uz:hover,.uz.dov{border-color:var(--mg);background:var(--mg-l)}
.pbw{height:4px;background:var(--g200);border-radius:3px;overflow:hidden;margin-top:6px}
.pb{height:100%;background:var(--mg);border-radius:3px;transition:width .3s}
.cs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cs-item{display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--g200);border-radius:6px;cursor:pointer;font-size:11px;color:var(--g700)}
.cs-item:hover,.cs-item.on{border-color:var(--mg);background:var(--mg-l);color:var(--mg-d);font-weight:700}
.pg{display:flex;align-items:center;justify-content:space-between;padding:10px 0 0}
.pg-inf{font-size:11px;color:var(--g500)}
.pg-bs{display:flex;gap:3px}
.pg-b{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--g200);background:#fff;color:var(--g600)}
.pg-b:hover{border-color:var(--mg);color:var(--mg)}
.pg-b.on{background:var(--mg);border-color:var(--mg);color:#fff}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:2000;display:flex;align-items:center;justify-content:center}
.popup-box{background:#fff;border-radius:var(--r-lg);padding:28px 32px;max-width:360px;width:90%;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.18)}
.popup-icon{font-size:40px;margin-bottom:12px}
.popup-title{font-size:16px;font-weight:800;margin-bottom:6px}
.popup-msg{font-size:13px;color:var(--g500);margin-bottom:20px;line-height:1.6}
.popup-btn{padding:9px 28px;background:var(--mg);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:700;cursor:pointer}
.toast{position:fixed;bottom:20px;right:20px;background:var(--g800);color:#fff;padding:10px 14px;border-radius:var(--r);font-size:12px;font-weight:600;z-index:9999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.ok{background:#166534}.toast.err{background:#991B1B}
.chart-wrap{position:relative;height:240px}
.sec-title{font-size:11px;font-weight:800;color:var(--mg-d);text-transform:uppercase;letter-spacing:.07em;padding:8px 0 5px;border-bottom:2px solid var(--mg-l);margin-bottom:10px}
.empty{padding:32px;text-align:center;color:var(--g400);font-size:12px}
.info-box{background:var(--mg-l);border:1px solid var(--mg-m);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--mg-d);margin-bottom:12px}
.danger-zone{background:#FFF1F2;border:1px solid #FFE4E6;border-radius:var(--r);padding:12px}
input[type=checkbox]{accent-color:var(--mg);width:12px;height:12px;cursor:pointer}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--g300);border-radius:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* role badge colors */
.role-master{background:var(--mg);color:#fff}
.role-admin{background:var(--blue-l);color:var(--blue)}
.role-viewer{background:var(--g200);color:var(--g600)}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" style="display:none;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(150deg,#FFF8ED,#FEF0D0,#FDDDA0)">
 <div class="ac">
  <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:22px">
   <svg width="72" height="72" viewBox="0 0 200 200" fill="none">
    <path d="M155 40 C170 60 175 90 165 118 C155 145 135 162 110 168 C85 174 62 165 48 148 C34 131 32 107 42 85 C52 63 72 48 95 43 C118 38 140 20 155 40Z" fill="none" stroke="#F5A623" stroke-width="12" stroke-linejoin="round"/>
    <circle cx="130" cy="72" r="10" fill="#F5A623"/>
    <path d="M48 148 L22 162 L44 155Z" fill="#F5A623"/>
    <path d="M44 155 L18 175 L42 165Z" fill="#F5A623"/>
    <path d="M55 165 L38 188 L60 175Z" fill="#F5A623"/>
   </svg>
   <div style="display:flex;align-items:baseline;margin-top:6px">
    <span style="font-size:26px;font-weight:900;color:#F5A623">MANGO</span>
    <span style="font-size:26px;font-weight:900;color:#404040">BOOST</span>
   </div>
   <div style="font-size:11px;color:var(--g400);margin-top:2px">HR Management System</div>
  </div>
  <div id="l-err" class="aerr"></div>
  <button class="gbtn" id="btn-google" style="margin-bottom:12px">
   <svg width="18" height="18" viewBox="0 0 18 18"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
   Google 계정으로 로그인
  </button>
  <div class="adiv">또는 이메일로 로그인</div>
  <div class="albl">이메일</div>
  <input id="l-em" class="ainp" type="email" placeholder="name@mangoboost.io">
  <div class="albl">비밀번호</div>
  <input id="l-pw" class="ainp" type="password" placeholder="••••••••">
  <button class="abtn" id="btn-login">로그인</button>
  <div style="margin-top:10px;font-size:10px;color:var(--g400)">@mangoboost.io 계정만 접속 가능</div>
 </div>
</div>

<!-- APP -->
<div id="app">
<div class="layout">
<nav class="sb">
 <div class="sb-logo">

// ══════════════ DATE HELPERS ══════════════
function xlsSerial(n){const d=new Date(Date.UTC(1899,11,30)+Number(n)*86400000);return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
function normDate(v){
  if(!v&&v!==0)return'';const s=String(v).trim();if(!s)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(/^\d{4}\/\d{2}\/\d{2}$/.test(s))return s.replace(/\//g,'-');
  const n=Number(s);if(!isNaN(n)&&n>20000&&n<100000)return xlsSerial(n);
  const d=new Date(s);if(!isNaN(d.getTime()))return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return s;
}
function parseDate(s){if(!s)return null;const m=String(s).match(/^(\d{4})[-\/](\d{2})[-\/](\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);const d=new Date(s);return isNaN(d)?null:d}
function dateLE(a,b){if(!a||!b)return false;return a.getFullYear()*10000+a.getMonth()*100+a.getDate()<=b.getFullYear()*10000+b.getMonth()*100+b.getDate()}
function dateLT(a,b){if(!a||!b)return false;return a.getFullYear()*10000+a.getMonth()*100+a.getDate()<b.getFullYear()*10000+b.getMonth()*100+b.getDate()}
function fmtTenure(s){if(!s)return'-';const jd=parseDate(s);if(!jd)return'-';const now=new Date();const months=(now.getFullYear()-jd.getFullYear())*12+(now.getMonth()-jd.getMonth());if(months<1)return'1개월 미만';const y=Math.floor(months/12),m=months%12;return y===0?`${m}개월`:`${y}년 ${m}개월 (총 ${months}개월)`}
function calcAge(s){if(!s)return'';const bd=parseDate(s);if(!bd)return'';const now=new Date();let age=now.getFullYear()-bd.getFullYear();if(now.getMonth()<bd.getMonth()||(now.getMonth()===bd.getMonth()&&now.getDate()<bd.getDate()))age--;return String(age)}

async function dbGetEmployees(){
  const {data,error}=await supa.from('employees').select('*').order('created_at');
  if(error){console.error(error);return[]}
  return data.map(r=>({_id:r.id,...r.data,emp_id:r.emp_id,name_kr:r.name_kr}));
}
async function dbUpsertEmployee(emp){
  const {_id,...rest}=emp;
  const row={emp_id:rest.empId||null,name_kr:rest.nameKr||null,data:rest,updated_at:new Date().toISOString()};
  if(_id&&!_id.startsWith('new_')){
    const{error}=await supa.from('employees').update(row).eq('id',_id);
    if(error)throw error;return _id;
  } else {
    const{data,error}=await supa.from('employees').insert(row).select('id').single();
    if(error)throw error;return data.id;
  }
}

// ✅ 수정: 사진 → Supabase Storage 업로드
async function dbUpsertPhoto(empId,fileOrUrl){
  // fileOrUrl 이 File 객체면 Storage 업로드, 문자열이면 URL 직접 저장
  let url = fileOrUrl;
  if(fileOrUrl instanceof File){
    const ext = fileOrUrl.name.split('.').pop() || 'jpg';
    const path = `${empId}.${ext}`;
    // upsert: 같은 경로에 덮어쓰기
    const{error:upErr} = await supa.storage.from(PHOTO_BUCKET).upload(path, fileOrUrl, {upsert:true, contentType:fileOrUrl.type});
    if(upErr) throw upErr;
    const{data:pub} = supa.storage.from(PHOTO_BUCKET).getPublicUrl(path);
    // 캐시 무효화를 위해 timestamp 쿼리 추가
    url = pub.publicUrl + '?t=' + Date.now();
  }
  // photos 테이블에 URL 저장
  const{data:ex}=await supa.from('photos').select('id').eq('employee_id',empId);
  if(ex&&ex.length>0){
    await supa.from('photos').update({url}).eq('employee_id',empId);
  } else {
    await supa.from('photos').insert({employee_id:empId,url});
  }
  return url;
}
async function dbDeletePhoto(empId){
  // Storage 파일 삭제 시도 (파일명 패턴으로 리스트 후 삭제)
  const{data:files}=await supa.storage.from(PHOTO_BUCKET).list('',{search:empId});
  if(files&&files.length){
    const paths=files.map(f=>f.name);
    await supa.storage.from(PHOTO_BUCKET).remove(paths);
  }
  await supa.from('photos').delete().eq('employee_id',empId);
}

const _dpSt={};
function dpHTML(id,val=''){return`<div class="dp-wrap" id="dpw-${id}"><input class="finp" id="${id}" value="${val}" placeholder="YYYY-MM-DD" autocomplete="off"><div class="dp-cal" id="dpc-${id}"></div></div>`}
function dpInit(id){
  const inp=document.getElementById(id);const cal=document.getElementById('dpc-'+id);if(!inp||!cal)return;
  const v=inp.value;const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);const now=new Date();
  _dpSt[id]={y:m?+m[1]:now.getFullYear(),mo:m?+m[2]-1:now.getMonth(),mode:'day'};
  inp.addEventListener('click',function(e){e.stopPropagation();document.querySelectorAll('.dp-cal.open').forEach(c=>{if(c!==cal)c.classList.remove('open')});dpRender(id);cal.classList.toggle('open')});
  inp.addEventListener('input',function(){
    const raw=this.value.replace(/-/g,'');let str=this.value.trim();
    if(/^\d{8}$/.test(raw))str=`${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;
    const mm=str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(mm){this.value=str;_dpSt[id]={y:+mm[1],mo:+mm[2]-1,mode:'day'};dpRender(id);cal.classList.add('open')}
  });
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();const raw=this.value.replace(/-/g,'');if(/^\d{8}$/.test(raw))this.value=`${raw.slice(0,4)}-${raw.slice(4,6)}-${raw.slice(6,8)}`;cal.classList.remove('open')}else if(e.key==='Escape')cal.classList.remove('open')});
  document.addEventListener('click',function(e){if(!e.target.closest('#dpw-'+id))cal.classList.remove('open')},{capture:true});
}
function dpRender(id){
  const cal=document.getElementById('dpc-'+id);if(!cal)return;const st=_dpSt[id];if(!st)return;
  const inp=document.getElementById(id);const selV=inp?inp.value:'';const now=new Date();
  if(st.mode==='year'){
    const base=Math.floor(st.y/12)*12;let h=`<div class="dp-nav"><button class="dp-nb" onclick="dpYShift('${id}',-12)">‹</button><span class="dp-hd">${base}–${base+11}</span><button class="dp-nb" onclick="dpYShift('${id}',12)">›</button></div><div class="dp-sg">`;
    for(let i=base;i<base+12;i++)h+=`<button class="dp-sb${i===st.y?' dp-on':''}" onclick="dpSelY('${id}',${i})">${i}</button>`;
    h+='</div>';cal.innerHTML=h;return;
  }
  if(st.mode==='month'){
    const ms=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    let h=`<div class="dp-nav"><button class="dp-nb" onclick="dpYShift('${id}',-1)">‹</button><span class="dp-hd" onclick="dpSetMode('${id}','year')">${st.y}년</span><button class="dp-nb" onclick="dpYShift('${id}',1)">›</button></div><div class="dp-sg">`;
    ms.forEach((mn,i)=>h+=`<button class="dp-sb${i===st.mo?' dp-on':''}" onclick="dpSelM('${id}',${i})">${mn}</button>`);
    h+='</div>';cal.innerHTML=h;return;
  }
  const first=new Date(st.y,st.mo,1).getDay();const days=new Date(st.y,st.mo+1,0).getDate();
  const mns=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  let h=`<div class="dp-nav"><button class="dp-nb" onclick="dpNavM('${id}',-1)">‹</button><span class="dp-hd" onclick="dpSetMode('${id}','month')">${st.y}년 ${mns[st.mo]}</span><button class="dp-nb" onclick="dpNavM('${id}',1)">›</button></div>
  <div class="dp-grid"><div class="dp-dow">일</div><div class="dp-dow">월</div><div class="dp-dow">화</div><div class="dp-dow">수</div><div class="dp-dow">목</div><div class="dp-dow">금</div><div class="dp-dow">토</div>`;
  for(let i=0;i<first;i++)h+=`<div class="dp-day dp-empty"></div>`;
  for(let d=1;d<=days;d++){const ds=`${st.y}-${String(st.mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const isT=d===now.getDate()&&st.mo===now.getMonth()&&st.y===now.getFullYear();const isS=ds===selV;h+=`<div class="dp-day${isT?' dp-today':''}${isS?' dp-sel':''}" onclick="dpSelD('${id}','${ds}')">${d}</div>`}
  h+='</div>';cal.innerHTML=h;
}
function dpNavM(id,d){const st=_dpSt[id];if(!st)return;st.mo+=d;if(st.mo<0){st.mo=11;st.y--}if(st.mo>11){st.mo=0;st.y++}dpRender(id)}
function dpYShift(id,d){const st=_dpSt[id];if(!st)return;st.y+=d;dpRender(id)}
function dpSetMode(id,m){const st=_dpSt[id];if(!st)return;st.mode=m;dpRender(id)}
function dpSelY(id,y){const st=_dpSt[id];if(!st)return;st.y=y;st.mode='month';dpRender(id)}
function dpSelM(id,m){const st=_dpSt[id];if(!st)return;st.mo=m;st.mode='day';dpRender(id)}
function dpSelD(id,ds){const inp=document.getElementById(id);if(!inp)return;inp.value=ds;const m=ds.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m&&_dpSt[id]){_dpSt[id].y=+m[1];_dpSt[id].mo=+m[2]-1}document.getElementById('dpc-'+id).classList.remove('open')}
function dpVal(id){const el=document.getElementById(id);return el?el.value.trim():''}
function dpInitAll(ids){ids.forEach(id=>dpInit(id))}

function avHTML(e,size=26){
  const ph=PHDB();const id=e._id;
  if(ph[id])return`<div class="av" style="width:${size}px;height:${size}px"><img src="${ph[id]}" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`;

function getActiveLeave(empId,ref){
  ref=ref||new Date();
  return(LVDB()[empId]||[]).find(lv=>{
    if(!lv.startDate)return false;
    const s=parseDate(lv.startDate);if(!s||!dateLE(s,ref))return false;
    if(lv.returnDate&&dateLE(parseDate(lv.returnDate),ref))return false;
    if(lv.endDate&&dateLT(parseDate(lv.endDate),ref))return false;
    return true;
  })||null;
}
function isActive(e,date){
  if(!e.joinDate)return false;
  const jd=parseDate(e.joinDate);if(!jd||!dateLE(jd,date))return false;
  if(e.resignDate&&dateLT(parseDate(e.resignDate),date))return false;
  if(e.status==='Resigned'&&!e.resignDate)return false;
  return true;
}

async function initAuth(){

  const {data:{session}}=await supa.auth.getSession();
  if(session){
    document.getElementById('auth').style.display='none';
    await onLogin(session.user);
  }
  supa.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session){
      document.getElementById('auth').style.display='none';
      await onLogin(session.user);
    }else if(event==='SIGNED_OUT'){
      document.getElementById('app').style.display='none';
      document.getElementById('auth').style.display='flex';
    }
  });
}

function renderDash(){

  const oneMonthAgo=new Date(now.getFullYear(),now.getMonth()-1,now.getDate());
  const active=data.filter(e=>isActive(e,now));
  const recent=data.filter(e=>{if(!e.joinDate)return false;const d=parseDate(e.joinDate);return d&&d>=oneMonthAgo&&d<=now});
  const types=['Regular','Contract','Intern','Temp'];
  const totals={};types.forEach(t=>{totals[t]=active.filter(e=>e.empType===t).length});
  const regions=[...new Set(active.map(e=>e.region||'기타'))].sort();
  const matrix={};
  regions.forEach(r=>{matrix[r]={};types.forEach(t=>{matrix[r][t]=0});matrix[r].total=0});
  active.forEach(e=>{const r=e.region||'기타';if(matrix[r]){if(types.includes(e.empType))matrix[r][e.empType]++;matrix[r].total++}});
  document.getElementById('cnt').innerHTML=`
  <div class="sg">
   <div class="sc"><div class="sc-lbl">전체 재직 인원</div><div class="sc-val">${active.length}</div><div class="sc-sub">전체 등록 ${data.length}명</div></div>
   <div class="sc"><div class="sc-lbl">이번 달 입사</div><div class="sc-val">${recent.length}</div><div class="sc-sub">최근 30일 내</div></div>
   <div class="sc"><div class="sc-lbl">정규직</div><div class="sc-val">${totals.Regular||0}</div><div class="sc-sub">계약 ${totals.Contract||0} · 인턴 ${totals.Intern||0} · Temp ${totals.Temp||0}</div></div>
   <div class="sc"><div class="sc-lbl">퇴직 예정</div><div class="sc-val">${data.filter(e=>e.status==='Will resign').length}</div><div class="sc-sub">퇴직완료 ${data.filter(e=>e.status==='Resigned').length}명</div></div>
  </div>
  <div class="grid2" style="margin-bottom:14px">
   <div class="card"><div class="card-h"><span class="card-t">Region × 고용형태</span></div>
    <div class="tw"><table><thead><tr><th>Region</th>${types.map(t=>`<th style="text-align:center">${t}</th>`).join('')}<th style="text-align:center">합계</th></tr></thead>
    <tbody>${regions.map(r=>`<tr><td style="font-weight:600">${r}</td>${types.map(t=>`<td style="text-align:center">${matrix[r][t]||0}</td>`).join('')}<td style="text-align:center;font-weight:700;color:var(--mg-d)">${matrix[r].total}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">데이터 없음</td></tr>'}
    <tr style="background:var(--mg-l)"><td style="font-weight:800;color:var(--mg-d)">합계</td>${types.map(t=>`<td style="text-align:center;font-weight:700">${totals[t]||0}</td>`).join('')}<td style="text-align:center;font-weight:800;color:var(--mg-d)">${active.length}</td></tr></tbody></table></div>
   </div>
   <div class="card"><div class="card-h"><span class="card-t">최근 1개월 입사자</span></div>
    <div class="tw"><table><thead><tr><th>이름</th><th>그룹</th><th>고용형태</th><th>입사일</th></tr></thead>
    <tbody>${recent.map(e=>`<tr><td><div class="td-nm">${avHTML(e,22)}<div><div class="nm">${e.nameKr}</div></div></div></td><td>${e.group||'-'}</td><td>${empTypeBdg(e.empType)}</td><td>${e.joinDate||'-'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">없음</td></tr>'}</tbody></table></div>
   </div>
  </div>
  <div class="card"><div class="card-h"><span class="card-t">최근 1년 월말 인원 추이</span></div>
   <div class="card-b"><div class="chart-wrap"><canvas id="trend-chart"></canvas></div></div>
  </div>`;
  renderTrendChart(data);
}
function renderTrendChart(data){
  const labels=[],totalDs=[],rSets={};const now=new Date();
  for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i+1,0);labels.push(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`);const ac=data.filter(e=>isActive(e,d));totalDs.push(ac.length);[...new Set(data.map(e=>e.region||'기타'))].forEach(r=>{if(!rSets[r])rSets[r]=[];rSets[r].push(ac.filter(e=>(e.region||'기타')===r).length)})}
  const colors=['#F5A623','#3B82F6','#10B981','#8B5CF6','#EF4444'];
  const datasets=[{label:'Total',data:totalDs,borderColor:'#F5A623',backgroundColor:'rgba(245,166,35,.08)',borderWidth:2.5,tension:.3,fill:true,pointRadius:3,pointBackgroundColor:'#F5A623'}];
  Object.entries(rSets).forEach(([r,d],i)=>datasets.push({label:r,data:d,borderColor:colors[(i+1)%colors.length],backgroundColor:'transparent',borderWidth:1.5,tension:.3,pointRadius:2}));
  if(dlChart){try{dlChart.destroy()}catch(e){}}
  const canvas=document.getElementById('trend-chart');if(!canvas)return;
  dlChart=new Chart(canvas,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{size:10},padding:10}}},scales:{y:{beginAtZero:false,ticks:{precision:0,font:{size:10}}},x:{ticks:{font:{size:10}}}}}});
}

  document.getElementById('eq').addEventListener('input',e=>{empQ=e.target.value;empPage=1;renderEmpTbl()});

function renderEmpTbl(){
  const now=new Date();
  let f=DB().filter(e=>{
    const q=empQ.toLowerCase();
    if(q&&![(e.nameKr||''),(e.nameEn||''),(e.empId||''),(e.email||'')].some(x=>x.toLowerCase().includes(q)))return false;
    if(empFG&&e.group!==empFG)return false;
    if(empFT&&e.empType!==empFT)return false;
    if(empFS&&e.status!==empFS)return false;
    return true;
  });
  const total=f.length,pages=Math.ceil(total/PER)||1;
  if(empPage>pages)empPage=1;
  const sl=f.slice((empPage-1)*PER,empPage*PER);
  const rows=sl.map(e=>{
    const lv=getActiveLeave(e._id,now);
    const isResigned=e.status==='Resigned'||!!e.resignDate;
    const rowCls=isResigned?'row-resigned':lv?'row-leave':'';
    let extra='';
    if(isResigned&&e.resignDate)extra=`<span style="color:var(--red);font-size:10px;font-weight:700;margin-left:5px">퇴직 ${e.resignDate}</span>`;
    else if(lv)extra=`<span style="color:var(--blue);font-size:10px;font-weight:700;margin-left:5px">휴직중 ${lv.startDate}~${lv.endDate||'미정'}</span>`;
    return`<tr class="${rowCls} _emp-row" data-id="${e._id}" style="cursor:pointer">
     <td><span class="bdg bdg-mg">${e.empId||'-'}</span></td>
     <td><div class="td-nm">${avHTML(e,26)}<div><div class="nm">${e.nameKr||'-'}${extra}</div><div class="nm-en">${e.nameEn||''}</div></div></div></td>
     <td style="font-size:11px">${e.group||'-'}</td><td style="font-size:11px">${e.team||'-'}</td>
     <td style="font-size:11px">${e.jobTitle||'-'}</td>
     <td>${empTypeBdg(e.empType)}</td><td>${stsBdg(e.status)}</td>
     <td>${techBdg(e.techFlag)}</td>
     <td style="font-size:11px;color:var(--g500)">${e.joinDate||'-'}</td>
     <td style="font-size:11px;color:var(--red)">${e.resignDate||''}</td>
    </tr>`;
  }).join('');
  const tblEl=document.getElementById('emp-tbl');
  tblEl.innerHTML=`<div class="tw"><table><thead><tr><th>EMP ID</th><th>이름</th><th>Group</th><th>Team</th><th>Job Title</th><th>고용형태</th><th>상태</th><th>Tech</th><th>입사일</th><th>퇴직일</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">데이터 없음</td></tr>'}</tbody></table></div>`;
  // 클릭 이벤트는 cnt 전역 위임으로 처리 (buildSidebar 위에서 등록)
  let pg=`<div class="pg"><span class="pg-inf">총 ${total}명</span><div class="pg-bs"><div class="pg-b" id="pg-prev">‹</div>`;
  for(let i=1;i<=Math.min(pages,7);i++)pg+=`<div class="pg-b${i===empPage?' on':''}" data-p="${i}">${i}</div>`;
  if(pages>7)pg+=`<span style="padding:0 4px">…</span><div class="pg-b${pages===empPage?' on':''}" data-p="${pages}">${pages}</div>`;
  pg+=`<div class="pg-b" id="pg-next">›</div></div></div>`;
  const pgEl=document.getElementById('emp-pg');pgEl.innerHTML=pg;
  pgEl.querySelector('#pg-prev').addEventListener('click',()=>{if(empPage>1){empPage--;renderEmpTbl()}});
  pgEl.querySelector('#pg-next').addEventListener('click',()=>{if(empPage<pages){empPage++;renderEmpTbl()}});
  pgEl.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{empPage=+b.dataset.p;renderEmpTbl()}));
}

function dfld(k,l,opts=[],val=''){
  if(opts.length)return`<div class="fgrp"><label class="flbl">${l}</label><select class="fsel2" id="ef-${k}"><option value="">선택</option>${opts.map(o=>`<option value="${o}"${val===o?' selected':''}>${o}</option>`).join('')}</select></div>`;
  return`<div class="fgrp"><label class="flbl">${l}${k==='nameKr'?'<span class="req">*</span>':''}</label><input class="finp" id="ef-${k}" value="${(val||'').replace(/"/g,'&quot;')}"></div>`;
}
function ddp(k,l,val=''){return`<div class="fgrp"><label class="flbl">${l}</label>${dpHTML('ef-'+k,val)}</div>`}

function dlEvalTemplate(){

  const ws=XLSX.utils.aoa_to_sheet([['EMP ID','KR Name','Year','Eval Type (performance/corevalue/final)','Grade','Note'],['EMP001','홍길동',yr,'performance','MVC',''],['EMP001','홍길동',yr,'corevalue','EX',''],['EMP001','홍길동',yr,'final','O','']]);
  XLSX.utils.book_append_sheet(wb,ws,'Eval_Upload');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['유형','등급(높은순)'],['performance','MVC/VC/FC/PC/LC'],['corevalue','EX/ME/ND'],['final','O/EE/ME/BE/NI']]),'등급안내');

async function handleEvalUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary',cellDates:false});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      const data=DB();let ok=0,skip=0;
      for(const row of json){
        const empId=String(row['EMP ID']||'').trim();const year=parseInt(row['Year']||0);
        const type=String(row['Eval Type (performance/corevalue/final)']||'').trim().toLowerCase();
        const grade=String(row['Grade']||'').trim();const note=String(row['Note']||'').trim();
        if(!empId||!year||!type||!grade){skip++;continue}
        const emp=data.find(e=>e.empId===empId);if(!emp){skip++;continue}
        try{await dbUpsertEvaluation(emp._id,year,type,grade,note);ok++}catch(e){skip++}
      }
      await loadAllData();renderEval();
      showPopup('📊','평가 업로드 완료',`${ok}건 등록 완료 / ${skip}건 건너뜀`,null);
    }catch(err){toast('오류: '+err.message,'err')}
  };
  reader.readAsBinaryString(file);input.value='';
}

  const ws=XLSX.utils.aoa_to_sheet([headerRow,exampleRow,Array(COLS.length).fill('')]);
  ws['!cols']=COLS.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'HR_Upload');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['컬럼명','필드키'],...COLS.map(c=>[c.l,c.k])]),'컬럼설명');
  XLSX.writeFile(wb,'MangoBoost_HR_Upload_Template.xlsx');toast('다운로드 완료','ok');

async function processUpload(file){
  if(!file)return;
  const res=document.getElementById('ul-result');
  res.innerHTML=`<div style="margin-top:12px"><div style="font-size:12px;color:var(--g500)">${file.name} 처리 중...</div><div class="pbw"><div class="pb" id="upb" style="width:0%"></div></div></div>`;
  let p=0;const pi=setInterval(()=>{p=Math.min(p+10,70);const el=document.getElementById('upb');if(el)el.style.width=p+'%'},100);
  const reader=new FileReader();
  reader.onload=async ev=>{
    clearInterval(pi);
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary',cellDates:false});
      const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
      if(!json.length){res.innerHTML+='<p style="color:var(--red);margin-top:8px">데이터 없음</p>';return}
      const existing=DB();let added=0,updated=0,skipped=0;
      for(const row of json){
        const emp={};
        Object.entries(row).forEach(([h,v])=>{const k=CSV_MAP[String(h).trim()];if(!k)return;let sv=String(v).trim();if(!sv)return;if(DATE_KEYS.includes(k))sv=normDate(sv)||sv;emp[k]=sv});
        if(!emp.nameKr&&!emp.empId){skipped++;continue}
        if(emp.birthDate){const a=calcAge(emp.birthDate);if(a){emp.age=a;const y=+a;emp.ageGroup=y<30?'30대미만':y<40?'30~39세':y<50?'40~49세':y<60?'50~59세':'60세이상'}}
        let found=null;
        if(emp.empId)found=existing.find(x=>x.empId===emp.empId);
        if(!found&&emp.nameKr)found=existing.find(x=>x.nameKr===emp.nameKr);
        if(found){emp._id=found._id;try{await dbUpsertEmployee(emp);updated++}catch(e){skipped++}}
        else{try{await dbUpsertEmployee(emp);added++}catch(e){skipped++}}
      }
      await loadAllData();
      const pb=document.getElementById('upb');if(pb)pb.style.width='100%';
      res.innerHTML+=`<div style="margin-top:10px;padding:12px;background:var(--mg-l);border-radius:var(--r);border:1px solid var(--mg-m)"><div style="font-size:13px;font-weight:700;color:var(--mg-d)">✓ 완료</div><div style="font-size:12px;margin-top:3px">신규 ${added}명 · 덮어쓰기 ${updated}명 · 건너뜀 ${skipped}건</div></div>`;
      showPopup('📂','업로드 완료',`신규 <strong>${added}명</strong> 추가<br>덮어쓰기 <strong>${updated}명</strong><br>히스토리(발령/평가/징계 등) 모두 보존됨`,()=>NAV('dashboard'));
    }catch(err){res.innerHTML+=`<p style="color:var(--red);margin-top:8px">오류: ${err.message}</p>`}
  };
  reader.readAsBinaryString(file);
}

  document.getElementById('cnt').innerHTML=`

     <button class="btn btn-s btn-sm" id="btn-col-all">전체선택</button>

     <button class="btn btn-p" style="margin-left:auto" id="btn-do-dl">📥 다운로드</button>
    </div>
   </div>
  </div></div>`;
  dpInit('dl-date');
  document.getElementById('btn-col-all').addEventListener('click',()=>{colAll(true);document.getElementById('col-sel-area').innerHTML=buildColSelector();bindColSel()});
  document.getElementById('btn-col-none').addEventListener('click',()=>{colAll(false);document.getElementById('col-sel-area').innerHTML=buildColSelector();bindColSel()});
  document.getElementById('btn-do-dl').addEventListener('click',doXlsDl);

function buildColSelector(){
  const groups=[...new Set(COLS.map(c=>c.g))];
  return groups.map(g=>`<div style="margin-bottom:10px"><div style="font-size:10px;font-weight:800;color:var(--g500);text-transform:uppercase;margin-bottom:5px">${g}</div><div class="cs-grid">${COLS.filter(c=>c.g===g).map(c=>`<div class="cs-item${selCols.has(c.k)?' on':''}" data-k="${c.k}"><input type="checkbox"${selCols.has(c.k)?' checked':''}> ${c.l}</div>`).join('')}</div></div>`).join('');
}
function bindColSel(){document.querySelectorAll('.cs-item[data-k]').forEach(el=>el.addEventListener('click',function(){const k=this.dataset.k;const cb=this.querySelector('input');if(selCols.has(k)){selCols.delete(k);this.classList.remove('on');cb.checked=false}else{selCols.add(k);this.classList.add('on');cb.checked=true}}))}
function colAll(v){if(v)COLS.forEach(c=>selCols.add(c.k));else selCols.clear()}
function doXlsDl(){
  const dateStr=dpVal('dl-date');let refDate=new Date();
  if(dateStr){const m=dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)refDate=new Date(+m[1],+m[2]-1,+m[3])}
  const refEnd=new Date(refDate.getFullYear(),refDate.getMonth(),refDate.getDate(),23,59,59);
  let data=DB().filter(e=>{if(!e.joinDate)return false;const jd=parseDate(e.joinDate);if(!jd||!dateLE(jd,refEnd))return false;if(e.resignDate&&dateLE(parseDate(e.resignDate),refDate))return false;if(e.status==='Resigned'&&!e.resignDate)return false;return true});
  if(!data.length&&!dateStr)data=DB();
  const cols=COLS.filter(c=>selCols.has(c.k));
  const ws=XLSX.utils.aoa_to_sheet([cols.map(c=>c.l),...data.map(e=>cols.map(c=>e[c.k]||''))]);
  ws['!cols']=cols.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'HR Data');
  const tag=dateStr||new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`MangoBoost_HR_${tag}.xlsx`);
  CM('m-dl');showPopup('📥','다운로드 완료',`${data.length}명 데이터 다운로드 완료`,null);
}

// 권한 변경 (인라인 select)
async function changeRole(userId,email,newRole){

}
// 권한 삭제
async function removeAdmin(userId){
